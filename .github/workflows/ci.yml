name: CI - Build Validation

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

jobs:
  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Make gradlew executable
        run: chmod +x PoseAI-Android/gradlew

      - name: Run Lint
        working-directory: PoseAI-Android
        run: |
          export JAVA_HOME=$JAVA_HOME
          export ANDROID_HOME=$HOME/Android/Sdk
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew :app:lintDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2g" --info 2>&1 | tail -50
        continue-on-error: true

      - name: Build Debug APK
        working-directory: PoseAI-Android
        run: |
          export JAVA_HOME=$JAVA_HOME
          export ANDROID_HOME=$HOME/Android/Sdk
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew :app:assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2g" --stacktrace 2>&1 | tail -80

      - name: Verify APK
        run: ls -la PoseAI-Android/app/build/outputs/apk/debug/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-apk-${{ github.sha }}
          path: PoseAI-Android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
