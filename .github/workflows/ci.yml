name: CI - Build Validation

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

# 同一分支只保留最新一次 CI，节省资源
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Make gradlew executable
        run: chmod +x PoseAI-Android/gradlew

      - name: Build Debug APK
        working-directory: PoseAI-Android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.0.0-ci"
        run: |
          ./gradlew :app:clean :app:assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2g" --stacktrace --console=plain 2>&1 | tail -80

      - name: Verify APK
        run: find PoseAI-Android -name "*.apk" -type f 2>/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-apk-${{ github.sha }}
          path: PoseAI-Android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
