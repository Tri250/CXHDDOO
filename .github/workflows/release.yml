# ============================================================
# Android Release Build Workflow
# 项目名称: PoseAI Android
# 包名: com.poseai.app
# ============================================================
#
# 触发条件:
#   - 推送 v* 形式的 tag（主要发布通道）
#   - main 分支推送（构建产物，但不创建 Release）
#   - 手动触发（workflow_dispatch）
#
# 功能:
#   - 构建 Release APK / AAB
#   - 校验 APK 签名
#   - tag 触发时自动创建 GitHub Release 并附带产物
#   - 失败时通过 Job Summary 输出诊断信息
# ============================================================

name: Android Release Build

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: '是否创建 GitHub Release（仅 tag 触发时强制创建）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'
  ANDROID_COMPILE_SDK: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=4'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          packages: 'platforms;android-${{ env.ANDROID_COMPILE_SDK }} build-tools;${{ env.ANDROID_BUILD_TOOLS }} platform-tools'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: PoseAI-Android

      - name: Print environment diagnostics
        run: |
          echo "=== Environment ==="
          echo "Branch: ${{ github.ref_name }}"
          echo "Event: ${{ github.event_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "=== Java ==="
          java -version
          echo "=== Gradle wrapper ==="
          cat PoseAI-Android/gradle/wrapper/gradle-wrapper.properties
          echo "=== Project version ==="
          grep -E "versionCode|versionName|compileSdk|targetSdk|minSdk" PoseAI-Android/app/build.gradle.kts || true

      - name: Setup signing key
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          STORE_PASSWORD_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          SIGNING_KEY_PATH="$HOME/signing-key.jks"
          if [ -z "$ANDROID_SIGNING_KEY" ]; then
            echo "::warning::No signing key secret found, generating a new debug-style keystore for this build"
            keytool -genkeypair -v \
              -keystore "$SIGNING_KEY_PATH" \
              -storetype PKCS12 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias poseai-key \
              -storepass poseai-signing-pass \
              -keypass poseai-signing-pass \
              -dname "CN=PoseAI, OU=App, O=PoseAI, L=Beijing, ST=Beijing, C=CN"
            echo "STORE_PASSWORD=poseai-signing-pass" >> $GITHUB_ENV
            echo "KEY_ALIAS=poseai-key" >> $GITHUB_ENV
            echo "KEY_PASSWORD=poseai-signing-pass" >> $GITHUB_ENV
          else
            echo "Using signing key from secrets..."
            echo "$ANDROID_SIGNING_KEY" | base64 --decode > "$SIGNING_KEY_PATH"
            echo "STORE_PASSWORD=$STORE_PASSWORD_SECRET" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS_SECRET" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASSWORD_SECRET" >> $GITHUB_ENV
          fi
          echo "SIGNING_KEY_PATH=$SIGNING_KEY_PATH" >> $GITHUB_ENV
          echo "Signing key ready at: $SIGNING_KEY_PATH"

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        working-directory: PoseAI-Android
        env:
          ORG_GRADLE_PROJECT_storeFile: ${{ env.SIGNING_KEY_PATH }}
          ORG_GRADLE_PROJECT_storePassword: ${{ env.STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_keyAlias: ${{ env.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_keyPassword: ${{ env.KEY_PASSWORD }}

      - name: Build Release AAB
        run: ./gradlew bundleRelease --no-daemon --stacktrace
        working-directory: PoseAI-Android
        env:
          ORG_GRADLE_PROJECT_storeFile: ${{ env.SIGNING_KEY_PATH }}
          ORG_GRADLE_PROJECT_storePassword: ${{ env.STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_keyAlias: ${{ env.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_keyPassword: ${{ env.KEY_PASSWORD }}

      - name: Locate and verify build outputs
        id: outputs
        run: |
          set -e
          APK_DIR="PoseAI-Android/app/build/outputs/apk/release"
          AAB_DIR="PoseAI-Android/app/build/outputs/bundle/release"

          mkdir -p "$APK_DIR" "$AAB_DIR"
          APK_FILE=$(find "$APK_DIR" -name "*.apk" 2>/dev/null | head -1 || true)
          AAB_FILE=$(find "$AAB_DIR" -name "*.aab" 2>/dev/null | head -1 || true)

          if [ -z "$APK_FILE" ]; then
            echo "::error::APK build output not found in $APK_DIR"
            ls -la "$APK_DIR" 2>/dev/null || echo "Directory does not exist"
            exit 1
          fi
          if [ -z "$AAB_FILE" ]; then
            echo "::error::AAB build output not found in $AAB_DIR"
            ls -la "$AAB_DIR" 2>/dev/null || echo "Directory does not exist"
            exit 1
          fi

          APK_BASENAME=$(basename "$APK_FILE")
          AAB_BASENAME=$(basename "$AAB_FILE")

          if echo "$APK_BASENAME" | grep -q "unsigned"; then
            echo "::error::APK is still unsigned: $APK_BASENAME"
            exit 1
          fi

          echo "APK: $APK_BASENAME"
          echo "AAB: $AAB_BASENAME"
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT
          echo "aab_path=$AAB_FILE" >> $GITHUB_OUTPUT
          echo "apk_basename=$APK_BASENAME" >> $GITHUB_OUTPUT
          echo "aab_basename=$AAB_BASENAME" >> $GITHUB_OUTPUT

          # 校验签名
          $ANDROID_HOME/build-tools/${{ env.ANDROID_BUILD_TOOLS }}/apksigner verify --verbose "$APK_FILE" || true

      - name: Upload APK artifact
        if: always() && steps.outputs.conclusion == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: PoseAI-Android-APK
          path: PoseAI-Android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB artifact
        if: always() && steps.outputs.conclusion == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: PoseAI-Android-AAB
          path: PoseAI-Android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## PoseAI Android Release Build"
            echo ""
            echo "- **Status**: ${{ job.status }}"
            echo "- **Branch/Tag**: \`${{ github.ref_name }}\`"
            echo "- **Commit**: \`${{ github.sha }}\`"
            echo "- **Trigger**: ${{ github.event_name }}"
            if [ "${{ steps.outputs.conclusion }}" = "success" ]; then
              echo "- **APK**: \`${{ steps.outputs.apk_basename }}\`"
              echo "- **AAB**: \`${{ steps.outputs.aab_basename }}\`"
            fi
            echo ""
            echo "构建日志详见上方 Steps。"
          } >> $GITHUB_STEP_SUMMARY

      - name: Create GitHub Release
        id: create_release
        if: startsWith(github.ref, 'refs/tags/') && success()
        uses: softprops/action-gh-release@v2
        with:
          name: PoseAI Android ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            PoseAI-Android/app/build/outputs/apk/release/*.apk
            PoseAI-Android/app/build/outputs/bundle/release/*.aab
          body: |
            ## PoseAI Android ${{ github.ref_name }}

            ### 安装说明
            1. 下载对应机型的 APK 文件（或下载 AAB 上传至 Google Play）
            2. 在 Android 设置中允许"安装未知来源应用"
            3. 点击 APK 完成安装
            4. 首次启动请授予相机/录音/存储权限

            ### 卸载说明
            - 系统设置 → 应用 → PoseAI → 卸载
            - 卸载会同时清除本地数据与已下载的 AI 模型文件

            ### 系统要求
            - Android 8.0 (API 26) 及以上
            - 推荐使用 Android 12+ 以获得最佳体验

            ---
            完整变更历史请见 [自动生成的 Release Notes](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }})。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Output release URL
        if: steps.create_release.conclusion == 'success'
        run: |
          echo "::notice::Release published: ${{ steps.create_release.outputs.url }}"
          echo "RELEASE_URL=${{ steps.create_release.outputs.url }}" >> $GITHUB_ENV

  notify:
    name: Build Status Notification
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Summarize pipeline status
        run: |
          STATUS="${{ needs.build.result }}"
          echo "::notice::Release workflow finished with status: $STATUS"
          if [ "$STATUS" != "success" ]; then
            echo "::error::Build failed — see build job logs for details"
            exit 0
          fi
