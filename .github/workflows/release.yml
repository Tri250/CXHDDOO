name: Android Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'
  ANDROID_COMPILE_SDK: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          packages: 'platforms;android-${{ env.ANDROID_COMPILE_SDK }} build-tools;${{ env.ANDROID_BUILD_TOOLS }} platform-tools'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: PoseAI-Android

      - name: Setup signing key
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          STORE_PASSWORD_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          SIGNING_KEY_PATH="$HOME/signing-key.jks"
          if [ -z "$ANDROID_SIGNING_KEY" ]; then
            echo "No signing key secret found, generating a new keystore..."
            keytool -genkeypair -v \
              -keystore "$SIGNING_KEY_PATH" \
              -storetype PKCS12 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias poseai-key \
              -storepass poseai-signing-pass \
              -keypass poseai-signing-pass \
              -dname "CN=PoseAI, OU=App, O=PoseAI, L=Beijing, ST=Beijing, C=CN"
            echo "STORE_PASSWORD=poseai-signing-pass" >> $GITHUB_ENV
            echo "KEY_ALIAS=poseai-key" >> $GITHUB_ENV
            echo "KEY_PASSWORD=poseai-signing-pass" >> $GITHUB_ENV
          else
            echo "Using signing key from secrets..."
            echo "$ANDROID_SIGNING_KEY" | base64 --decode > "$SIGNING_KEY_PATH"
            echo "STORE_PASSWORD=$STORE_PASSWORD_SECRET" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS_SECRET" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASSWORD_SECRET" >> $GITHUB_ENV
          fi
          echo "SIGNING_KEY_PATH=$SIGNING_KEY_PATH" >> $GITHUB_ENV
          echo "Signing key ready at: $SIGNING_KEY_PATH"

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: PoseAI-Android
        env:
          ORG_GRADLE_PROJECT_storeFile: ${{ env.SIGNING_KEY_PATH }}
          ORG_GRADLE_PROJECT_storePassword: ${{ env.STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_keyAlias: ${{ env.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_keyPassword: ${{ env.KEY_PASSWORD }}

      - name: Build Release AAB
        run: ./gradlew bundleRelease --no-daemon
        working-directory: PoseAI-Android
        env:
          ORG_GRADLE_PROJECT_storeFile: ${{ env.SIGNING_KEY_PATH }}
          ORG_GRADLE_PROJECT_storePassword: ${{ env.STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_keyAlias: ${{ env.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_keyPassword: ${{ env.KEY_PASSWORD }}

      - name: Verify APK signature
        run: |
          APK_FILE=$(find PoseAI-Android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK file: $APK_FILE"
          echo "APK name: $(basename $APK_FILE)"
          if echo "$APK_FILE" | grep -q "unsigned"; then
            echo "ERROR: APK is still unsigned!"
            exit 1
          else
            echo "OK: APK is signed"
          fi
          # 验证签名信息
          $ANDROID_HOME/build-tools/${{ env.ANDROID_BUILD_TOOLS }}/apksigner verify --verbose "$APK_FILE" || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PoseAI-Android-APK
          path: PoseAI-Android/app/build/outputs/apk/release/*.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: PoseAI-Android-AAB
          path: PoseAI-Android/app/build/outputs/bundle/release/*.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: PoseAI Android ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            PoseAI-Android/app/build/outputs/apk/release/*.apk
            PoseAI-Android/app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
