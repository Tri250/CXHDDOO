name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      versionCode:
        description: 'Version code (integer)'
        required: false
        default: '1'
      versionName:
        description: 'Version name (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"

jobs:
  build-release:
    name: Build Release APK & AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Pre-download Gradle wrapper distribution
        run: |
          GRADLE_VERSION="8.9"
          # Download the Gradle distribution that the wrapper expects
          # and place it where the wrapper caches it
          GRADLE_DIST="${GRADLE_USER_HOME}/wrapper/dists/gradle-${GRADLE_VERSION}-bin"
          mkdir -p "${GRADLE_DIST}"
          # Try up to 3 times to handle transient network issues
          for i in 1 2 3; do
            if curl -fsSL --connect-timeout 30 --max-time 300 \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -o "/tmp/gradle-${GRADLE_VERSION}-bin.zip"; then
              echo "Gradle ${GRADLE_VERSION} downloaded successfully"
              break
            fi
            echo "Download attempt $i failed, retrying..."
            sleep $((i * 5))
          done
          if [ -f "/tmp/gradle-${GRADLE_VERSION}-bin.zip" ]; then
            # Find the wrapper's expected hash directory
            cd PoseAI-Android
            WRAPPER_PROPS="gradle/wrapper/gradle-wrapper.properties"
            # Extract distribution URL and checksum
            DISTRIBUTION_URL=$(grep "distributionUrl" "$WRAPPER_PROPS" | sed 's/.*=//')
            DISTRIBUTION_SHA=$(grep "distributionSha256Sum" "$WRAPPER_PROPS" | sed 's/.*=//')
            # Create the expected directory structure
            WRAPPER_HASH=$(echo -n "$DISTRIBUTION_URL" | sha256sum | cut -c1-8)
            CACHE_DIR="${GRADLE_USER_HOME}/wrapper/dists/gradle-${GRADLE_VERSION}-bin/${WRAPPER_HASH}"
            mkdir -p "$CACHE_DIR"
            cp "/tmp/gradle-${GRADLE_VERSION}-bin.zip" "$CACHE_DIR/"
            # Create the .ok marker file
            touch "$CACHE_DIR/gradle-${GRADLE_VERSION}-bin.zip.ok"
            echo "Gradle placed in wrapper cache: $CACHE_DIR"
          else
            echo "WARNING: Failed to pre-download Gradle, will try wrapper download"
          fi

      - name: Resolve version & tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            VERSION_CODE="${{ github.run_number }}"
          else
            RELEASE_TAG="v${{ inputs.versionName || '1.0.0' }}"
            VERSION_NAME="${{ inputs.versionName || '1.0.0' }}"
            VERSION_CODE="${{ inputs.versionCode || github.run_number }}"
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Create signing keystore
        run: |
          mkdir -p ~/.android
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/release-key.jks
          else
            keytool -genkeypair -v -keystore ~/.android/release-key.jks \
              -storepass poseai_release -alias poseai -keypass poseai_release \
              -dname "CN=PoseAI, OU=Mobile, O=PoseAI, L=Beijing, ST=Beijing, C=CN" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Make gradlew executable
        run: chmod +x PoseAI-Android/gradlew

      - name: Build Debug APK
        working-directory: PoseAI-Android
        env:
          VERSION_CODE: ${{ steps.version.outputs.VERSION_CODE }}
          VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}
        run: |
          ./gradlew :app:clean :app:assembleDebug --no-daemon --console=plain
          echo "=== Debug APKs ==="
          find . -name "*.apk" -ls 2>/dev/null || echo "NONE"

      - name: Build Release APK & AAB
        working-directory: PoseAI-Android
        env:
          VERSION_CODE: ${{ steps.version.outputs.VERSION_CODE }}
          VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD || 'poseai_release' }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || 'poseai' }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD || 'poseai_release' }}
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --console=plain
          echo "=== Release outputs ==="
          find app/build/outputs -name "*.apk" -o -name "*.aab" -ls 2>/dev/null || echo "NONE"

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp PoseAI-Android/app/build/outputs/apk/debug/app-debug.apk artifacts/app-debug.apk
          cp PoseAI-Android/app/build/outputs/apk/release/app-release.apk artifacts/app-release.apk
          cp PoseAI-Android/app/build/outputs/bundle/release/app-release.aab artifacts/app-release.aab || true
          ls -la artifacts/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-${{ github.run_number }}
          path: artifacts/*
          retention-days: 30

      - name: Create & push tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.version.outputs.RELEASE_TAG }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skip."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.RELEASE_TAG }}
          name: PoseAI Android ${{ steps.version.outputs.RELEASE_TAG }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          files: |
            artifacts/app-release.apk
            artifacts/app-release.aab
            artifacts/app-debug.apk
          body: |
            ## PoseAI Android Release ${{ steps.version.outputs.RELEASE_TAG }}

            ### What's New
            - 全量 AI 模块激活（场景识别 / 姿态匹配 / OOTD 分析）
            - ML Kit 真实姿态检测
            - 真实 TTS 中文语音引导
            - Vlog 录制与合并
            - 自定义姿势采集与分享
            - 全部功能免费

            ### Features
            - 拍照 AI 场景检测（7 场景）
            - 实时姿态匹配（双人居中支持）
            - OOTD 穿搭分析（远程多模态 / 本地确定性降级）
            - Vlog 多角度录制合并
            - 构图辅助线（三分法 / 黄金分割）
