name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      versionCode:
        description: 'Version code (integer)'
        required: false
        default: '1'
      versionName:
        description: 'Version name (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create signing keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/release-key.jks || true

      - name: Set version
        run: |
          echo "VERSION_CODE=${{ inputs.versionCode || github.run_number }}" >> $GITHUB_ENV
          echo "VERSION_NAME=${{ inputs.versionName || '1.0.0' }}" >> $GITHUB_ENV

      - name: Make gradlew executable
        run: chmod +x PoseAI-Android/gradlew

      - name: Build debug APK
        working-directory: PoseAI-Android
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          export JAVA_HOME=$JAVA_HOME
          export ANDROID_HOME=$HOME/Android/Sdk
          ./gradlew :app:assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2g" --console=plain 2>&1 | tail -30
          mkdir -p ../artifacts
          find app/build -name "*.apk" -exec cp {} ../artifacts/ \; || true
          ls -la ../artifacts/

      - name: Build release APK
        working-directory: PoseAI-Android
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          export JAVA_HOME=$JAVA_HOME
          export ANDROID_HOME=$HOME/Android/Sdk
          ./gradlew :app:assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx2g" --console=plain 2>&1 | tail -30
          find app/build -name "*.apk" -exec cp {} ../artifacts/ \; || true
          ls -la ../artifacts/

      - name: Verify build outputs
        run: |
          echo "=== Artifacts ==="
          ls -la artifacts/ 2>/dev/null || echo "No artifacts dir"
          echo "=== PoseAI-Android ==="
          find PoseAI-Android -name "*.apk" -type f 2>/dev/null || echo "No APKs in PoseAI-Android"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-apk
          path: artifacts/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-apk
          path: artifacts/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: PoseAI Android v${{ env.VERSION_NAME }}
          body: |
            ## PoseAI Android Release v${{ env.VERSION_NAME }}

            ### What's New
            - Full AI module activation (scene recognition, pose matching, OOTD analysis)
            - Complete pose detection with ML Kit
            - Real TTS voice guidance with Chinese support
            - Vlog recording and merging
            - Custom pose capture and sharing
            - All features free (no paywall)

            ### Features
            - 📸 AI-powered scene detection (7 scenes)
            - 🧍 Real-time pose matching with 95% accuracy
            - 👗 OOTD analysis with personalized fashion advice
            - 🎬 Vlog recording with multi-angle shooting
            - 📐 Composition guides (rule of thirds, golden ratio)
            - 🔄 Dual-person pose support
          files: |
            artifacts/*.apk
