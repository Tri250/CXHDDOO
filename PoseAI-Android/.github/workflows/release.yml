name: Release Build & Publish

# ──────────────────────────────────────────────────────────────
# PoseAI Android Release 工作流
# 触发条件：推送 v* 格式的 tag（如 v2.1.0）
# 产物：签名 release APK + AAB，自动创建 GitHub Release
# ──────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release 标签名（如 v2.1.0）'
        required: true
        default: 'v2.1.0'

permissions:
  contents: write

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'
  ANDROID_SDK_VERSION: '35'
  GRADLE_OPTS: '-Xmx2048m -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.configureondemand=true'

jobs:
  build-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. 检出代码 ──
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. 确定 Release 标签名 ──
      - name: Resolve tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "📦 Release tag: $TAG"

      # ── 3. 配置 JDK 17 ──
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      # ── 4. 配置 Android SDK ──
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-${{ env.ANDROID_SDK_VERSION }}
            build-tools;34.0.0

      # ── 5. 缓存 Gradle 依赖 ──
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/*.gradle', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── 6. 配置签名密钥（从 GitHub Secrets 解码） ──
      - name: Configure signing keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # 解码 keystore 文件
          echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/poseai-release.jks"
          # 生成 gradle.properties 签名配置
          cat >> gradle.properties << EOF
          storeFile=$HOME/poseai-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "✅ Signing keystore configured"

      - name: No signing config warning
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        run: |
          echo "⚠️  ANDROID_KEYSTORE_BASE64 secret not set — building unsigned release"
          echo "   To enable signing, configure these repository secrets:"
          echo "   - ANDROID_KEYSTORE_BASE64 (base64 encoded .jks file)"
          echo "   - ANDROID_KEYSTORE_PASSWORD"
          echo "   - ANDROID_KEY_ALIAS"
          echo "   - ANDROID_KEY_PASSWORD"

      # ── 7. 授予 Gradlew 执行权限 ──
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── 8. 构建 Release APK ──
      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      # ── 9. 构建 Release AAB ──
      - name: Build Release AAB
        run: ./gradlew :app:bundleRelease --no-daemon --stacktrace

      # ── 10. 收集构建产物 ──
      - name: Collect build artifacts
        id: artifacts
        run: |
          mkdir -p artifacts
          # 复制 APK
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} artifacts/ \;
          # 复制 AAB
          find app/build/outputs/bundle/release -name "*.aab" -exec cp {} artifacts/ \;
          # 复制 mapping.txt（ProGuard 混淆映射，用于崩溃符号化）
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt artifacts/
          fi
          # 列出产物
          echo "📂 Build artifacts:"
          ls -lh artifacts/
          # 生成校验和
          cd artifacts && sha256sum * > checksums.sha256 && cd ..
          cat artifacts/checksums.sha256

      # ── 11. 上传构建产物到 Actions（临时存档） ──
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ steps.tag.outputs.name }}
          path: artifacts/*
          retention-days: 30

      # ── 12. 创建 GitHub Release ──
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: PoseAI ${{ steps.tag.outputs.name }}
          body: |
            ## PoseAI Android ${{ steps.tag.outputs.name }}

            ### 📦 下载说明
            - **APK 文件**：直接安装到设备（需允许"未知来源"安装）
            - **AAB 文件**：用于上传 Google Play Console
            - **checksums.sha256**：所有产物的 SHA-256 校验和

            ### 🔧 安装要求
            - Android 8.0 (API 26) 及以上
            - 需要相机权限
            - 建议设备内存 ≥ 4GB

            ### ✨ 主要功能
            - AI 姿势识别与实时引导
            - 22 场景 90+ 姿势模板库
            - 高级美颜（大眼/瘦鼻/瘦脸/亮眼等 9 项）
            - 美妆系统（口红/腮红/眼影/眼线等 6 项）
            - 皮肤修复（祛痘/祛斑/祛黑眼圈/均匀肤色）
            - AR 人脸特效（28 种）
            - 51 种滤镜（8 大分类）
            - LUT 滤镜引擎（.cube 格式）
            - GPU OpenGL ES 实时渲染
            - 照片编辑（文字/涂鸦/马赛克/贴纸/AI 抠图）
            - Vlog 视频录制与美颜
            - 智能构图（三分法/对角线/黄金螺旋）

            ### 📝 校验
            下载后请核对 SHA-256 校验和，确保文件完整无损。
          files: |
            artifacts/*.apk
            artifacts/*.aab
            artifacts/checksums.sha256
            artifacts/mapping.txt
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 13. 构建结果摘要 ──
      - name: Release Summary
        run: |
          echo "╔══════════════════════════════════════════════╗"
          echo "║       PoseAI Release Build Complete          ║"
          echo "╠══════════════════════════════════════════════╣"
          echo "║  Tag:     ${{ steps.tag.outputs.name }}"
          echo "║  Repo:    ${{ github.repository }}"
          echo "║  Commit:  ${{ github.sha }}"
          echo "║  Artifacts:"
          ls -1 artifacts/ | sed 's/^/║    /'
          echo "╚══════════════════════════════════════════════╝"
