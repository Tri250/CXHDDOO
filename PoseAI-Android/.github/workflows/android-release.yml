name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      versionCode:
        description: 'Version code (integer)'
        required: false
        default: ''
      versionName:
        description: 'Version name (e.g., 1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PoseAI-Android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Set up Gradle
        run: chmod +x gradlew

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          echo "VERSION_NAME=${TAG_NAME#v}" >> $GITHUB_ENV
          CODE=$(echo "${TAG_NAME#v}" | grep -oP '\d+$' || echo "1")
          echo "VERSION_CODE=${CODE}" >> $GITHUB_ENV

      - name: Override version from workflow inputs
        if: github.event_name == 'workflow_dispatch'
        run: |
          INPUT_CODE="${{ github.event.inputs.versionCode }}"
          INPUT_NAME="${{ github.event.inputs.versionName }}"
          if [ -n "$INPUT_CODE" ]; then
            echo "VERSION_CODE=$INPUT_CODE" >> $GITHUB_ENV
          fi
          if [ -n "$INPUT_NAME" ]; then
            echo "VERSION_NAME=$INPUT_NAME" >> $GITHUB_ENV
          fi

      - name: Set default version
        if: env.VERSION_CODE == ''
        run: |
          echo "VERSION_CODE=1" >> $GITHUB_ENV
          echo "VERSION_NAME=1.0.0" >> $GITHUB_ENV

      - name: Build Release APK
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" ]; then
            mkdir -p ~/.android
            echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/release-key.jks
          fi
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ env.VERSION_NAME }}
          path: PoseAI-Android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: PoseAI v${{ env.VERSION_NAME }}
          body: |
            ## PoseAI Android v${{ env.VERSION_NAME }}
            
            ### 更新内容
            - 全量功能自检修复优化
            - 性能与稳定性改进
            - 权限管理优化
            - 兼容性增强
            
            ### 版本号
            - Version Code: ${{ env.VERSION_CODE }}
            - Version Name: ${{ env.VERSION_NAME }}
          files: PoseAI-Android/app/build/outputs/apk/release/*.apk
          generate_release_notes: false