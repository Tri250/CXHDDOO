name: Android CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build-debug:
    name: Build & Lint Debug
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PoseAI-Android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Set up Gradle
        run: chmod +x gradlew

      - name: Run Lint & Build
        run: |
          ./gradlew :app:lintDebug --no-daemon --stacktrace
          LINT_EXIT=$?
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          ASSEMBLE_EXIT=$?
          # Fail if either failed
          exit $((LINT_EXIT + ASSEMBLE_EXIT))

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: PoseAI-Android/app/build/outputs/apk/debug/*.apk
          retention-days: 7