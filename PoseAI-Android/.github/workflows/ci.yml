name: CI - Build Validation

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Network diagnostics
        run: |
          echo "=== Testing network connectivity ==="
          echo "--- services.gradle.org ---"
          curl -sI --connect-timeout 10 https://services.gradle.org/distributions/gradle-8.9-bin.zip 2>&1 | head -3 || echo "FAILED"
          echo "--- dl.google.com ---"
          curl -sI --connect-timeout 10 https://dl.google.com/dl/android/maven2/ 2>&1 | head -3 || echo "FAILED"
          echo "--- maven.google.com ---"
          curl -sI --connect-timeout 10 https://maven.google.com/dl/android/maven2/ 2>&1 | head -3 || echo "FAILED"
          echo "--- repo1.maven.org ---"
          curl -sI --connect-timeout 10 https://repo1.maven.org/maven2/ 2>&1 | head -3 || echo "FAILED"
          echo "--- plugins.gradle.org ---"
          curl -sI --connect-timeout 10 https://plugins.gradle.org/m2/ 2>&1 | head -3 || echo "FAILED"
          echo "--- maven.aliyun.com (google) ---"
          curl -sI --connect-timeout 10 https://maven.aliyun.com/repository/google/ 2>&1 | head -3 || echo "FAILED"
          echo "--- maven.aliyun.com (central) ---"
          curl -sI --connect-timeout 10 https://maven.aliyun.com/repository/central/ 2>&1 | head -3 || echo "FAILED"
          echo "--- Check KSP plugin in Aliyun central ---"
          curl -sI --connect-timeout 10 https://maven.aliyun.com/repository/central/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.0.21-1.0.27/com.google.devtools.ksp.gradle.plugin-2.0.21-1.0.27.pom 2>&1 | head -3 || echo "FAILED"

      - name: Create gradle.properties for network resilience
        run: |
          mkdir -p PoseAI-Android
          cat > PoseAI-Android/gradle.properties << 'EOF'
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.internal.http.connectionTimeout=120000
          org.gradle.internal.http.socketTimeout=120000
          org.gradle.internal.http.maxRedirects=5
          org.gradle.jvmargs=-Xmx2048m -Xms512m -XX:MaxMetaspaceSize=512m
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF
          cat PoseAI-Android/gradle.properties

      - name: Build Debug APK
        working-directory: PoseAI-Android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.0.0-ci"
        run: |
          gradle :app:clean :app:assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2g" --stacktrace --console=plain

      - name: Verify APK
        run: find PoseAI-Android -name "*.apk" -type f 2>/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-apk-${{ github.sha }}
          path: PoseAI-Android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
